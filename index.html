<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#eef7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="每天 90 分钟，稳稳复习计算机 408。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=3">
  <link rel="stylesheet" href="details.css?v=3">
  <title>408 · 每日复习打卡</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="408 每日复习打卡首页"><span class="brand-mark">408</span><span>每日复习打卡</span></a>
      <button class="icon-button" id="settings-open" aria-label="编辑计划" title="编辑计划">⚙</button>
    </header>
    <main>
      <section class="hero">
        <div class="hero-copy"><p class="eyebrow">每天一点点，稳稳向前</p><h1>今天的 408，<span>开始吧。</span></h1><p class="hero-sub">两本教材 · 三个小任务 · 90 分钟专注</p></div>
        <div class="progress-ring" id="today-ring" role="img" aria-label="今日完成率"><div><strong id="today-percent">0%</strong><span>今日完成</span></div></div>
      </section>
      <section class="week-panel" aria-label="本周学习计划">
        <div class="week-heading"><div><p class="eyebrow">一周计划</p><h2 id="week-label"></h2></div><div class="week-nav"><button class="nav-button" id="week-prev" aria-label="上一周">‹</button><button class="nav-button" id="week-next" aria-label="下一周">›</button></div></div>
        <div class="week-strip" id="week-strip"></div>
        <div class="week-summary"><span>本周打卡</span><strong id="week-count">0 / 21</strong><span class="summary-bar"><i id="week-bar"></i></span><span id="week-rate">0%</span></div>
      </section>
      <section class="day-heading"><div><p class="eyebrow" id="selected-long-date"></p><h2>今日学习清单</h2></div><span class="daily-total">⏱ 90 分钟</span></section>
      <section class="task-list" id="task-list" aria-live="polite"></section>
      <section class="note-card"><span class="note-icon">✦</span><div><strong>给今天的自己</strong><p>完成比完美重要，专注当下这 40 分钟。</p></div></section>
      <footer>记录保存在当前浏览器中 · 坚持就是进步 🌱</footer>
    </main>
  </div>
  <dialog id="settings-dialog" class="settings-dialog"><form method="dialog" id="settings-form"><div class="modal-head"><div><p class="eyebrow">个性化你的计划</p><h2>编辑教材与主题</h2></div><button class="icon-button" value="cancel" aria-label="关闭">×</button></div><p class="settings-help">教材名称和每天的章节主题都可以修改，保存后会应用到整周。</p><label class="field-label">第一本教材<input id="book-one" maxlength="30" required></label><label class="field-label">第二本教材<input id="book-two" maxlength="30" required></label><div id="topic-fields" class="topic-fields"></div><div class="modal-actions"><button type="button" class="secondary-button" id="settings-cancel">取消</button><button class="primary-button" id="settings-save" value="save">保存计划</button></div></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
